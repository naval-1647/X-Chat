<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xchat - Navigation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #4f46e5, #10b981);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 1rem;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 3rem;
            border-radius: 20px;
            text-align: center;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
        }
        
        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, #fff, #f0f0f0);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .subtitle {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            opacity: 0.9;
        }
        
        .nav-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin: 2rem 0;
        }
        
        .nav-btn {
            background: rgba(255, 255, 255, 0.15);
            padding: 1.5rem;
            border-radius: 15px;
            text-decoration: none;
            color: white;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }
        
        .nav-btn:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
        }
        
        .nav-btn i {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }
        
        .nav-btn h3 {
            font-size: 1.2rem;
            margin-bottom: 0.25rem;
        }
        
        .nav-btn p {
            opacity: 0.8;
            font-size: 0.9rem;
        }
        
        .status {
            margin-top: 2rem;
            padding: 1rem;
            background: rgba(16, 185, 129, 0.2);
            border-radius: 10px;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        
        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }
        
        .status-item {
            text-align: center;
        }
        
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #10b981;
            display: inline-block;
            margin-right: 0.5rem;
        }
    </style>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-comments"></i> Xchat</h1>
        <p class="subtitle">Choose how you want to access Xchat</p>
        
        <div class="nav-buttons">
            <a href="/login" class="nav-btn">
                <i class="fas fa-sign-in-alt"></i>
                <h3>Login / Register</h3>
                <p>Beautiful auth interface</p>
            </a>
            
            <a href="/index.html" class="nav-btn">
                <i class="fas fa-rocket"></i>
                <h3>Main App</h3>
                <p>Full chat application</p>
            </a>
            
            <a href="http://localhost:8000/docs" target="_blank" class="nav-btn">
                <i class="fas fa-book"></i>
                <h3>API Docs</h3>
                <p>Backend documentation</p>
            </a>
            
            <a href="/test.html" class="nav-btn">
                <i class="fas fa-tools"></i>
                <h3>Test Page</h3>
                <p>Development tools</p>
            </a>
        </div>
        
        <div class="status">
            <h3><i class="fas fa-server"></i> Server Status</h3>
            <div class="status-grid">
                <div class="status-item">
                    <span class="status-indicator"></span>
                    Frontend: Port 3001
                </div>
                <div class="status-item">
                    <span class="status-indicator"></span>
                    Backend: Port 8000
                </div>
            </div>
        </div>
    </div>
</body>
</html>
